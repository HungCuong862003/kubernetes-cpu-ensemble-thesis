[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis_pipeline"
version = "0.1.0"
description = "Hybrid Ensemble Learning for Proactive Resource Prediction in Kubernetes"
authors = [{ name = "Jimmy", email = "jimmy@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

# Dependencies are pinned in requirements-lock.txt; this is the loose set.
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn==1.5.2",
    "xgboost",
    "lightgbm",
    "torch",
    "matplotlib",
    "seaborn",
    "scipy",
    "statsmodels",
    "shap",
    "joblib",
    "pyarrow",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
